name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  prospecting-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest docs/prospects/bb-prospecting-kit/__tests__ -q
